<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de Carros</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
}

#game{
    width:400px;
    height:700px;
    background:#555;
    position:relative;
    overflow:hidden;
    border:6px solid #fff;
}

.line{
    position:absolute;
    width:10px;
    height:100px;
    background:white;
    left:195px;
}

.player{
    position:absolute;
    width:60px;
    height:110px;
    background:red;
    border-radius:12px;
    bottom:20px;
    left:170px;
}

.enemy{
    position:absolute;
    width:60px;
    height:110px;
    background:deepskyblue;
    border-radius:12px;
}

#score{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
    font-weight:bold;
    z-index:100;
}
</style>
</head>
<body>

<div id="game">

<div id="score">Puntos: 0</div>

<div class="player" id="player"></div>

</div>

<script>

const game=document.getElementById("game");
const player=document.getElementById("player");
const scoreText=document.getElementById("score");

let score=0;
let speed=6;

let playerX=170;

const lanes=[20,95,170,245,320];

document.addEventListener("keydown",e=>{

    let index=lanes.indexOf(playerX);

    if(e.key==="ArrowLeft" && index>0){
        playerX=lanes[index-1];
    }

    if(e.key==="ArrowRight" && index<lanes.length-1){
        playerX=lanes[index+1];
    }

    player.style.left=playerX+"px";

});

for(let i=0;i<8;i++){

    let line=document.createElement("div");
    line.className="line";
    line.style.top=(i*100)+"px";
    game.appendChild(line);

}

function moveLines(){

    document.querySelectorAll(".line").forEach(line=>{

        let top=parseInt(line.style.top);

        top+=speed;

        if(top>700){
            top=-100;
        }

        line.style.top=top+"px";

    });

}

function createEnemy(){

    let enemy=document.createElement("div");

    enemy.className="enemy";

    enemy.style.left=lanes[Math.floor(Math.random()*lanes.length)]+"px";

    enemy.style.top="-120px";

    game.appendChild(enemy);

}

setInterval(createEnemy,1000);

function moveEnemies(){

    document.querySelectorAll(".enemy").forEach(enemy=>{

        let top=parseInt(enemy.style.top);

        top+=speed;

        enemy.style.top=top+"px";

        let eLeft=parseInt(enemy.style.left);

        if(
            top>560 &&
            top<660 &&
            eLeft===playerX
        ){
            alert("💥 ¡Game Over!\nPuntos: "+score);
            location.reload();
        }

        if(top>720){

            enemy.remove();

            score++;

            scoreText.innerHTML="Puntos: "+score;

            if(score%10===0){
                speed++;
            }

        }

    });

}

function gameLoop(){

    moveLines();

    moveEnemies();

    requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
